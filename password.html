<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewGuards – Zugang</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #3551FF;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1rem;
      font-weight: 400;
      color: #aaa;
      margin-bottom: 32px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }
    input[type="password"]:focus { border-color: #3551FF; }
    button {
      width: 100%;
      padding: 12px;
      background: #3551FF;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2a40e0; }
    .error {
      color: #ff4d4d;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ReviewGuards</div>
    <h1>Bitte Passwort eingeben</h1>
    <input type="password" id="pw" placeholder="Passwort" autofocus />
    <button onclick="check()">Einloggen</button>
    <p class="error" id="err">Falsches Passwort.</p>
  </div>
  <script>
    if (sessionStorage.getItem('rg_auth') === '1') {
      var dest = sessionStorage.getItem('rg_dest') || 'index.html';
      sessionStorage.removeItem('rg_dest');
      window.location.replace(dest);
    }

    document.getElementById('pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') check();
    });

    function check() {
      if (document.getElementById('pw').value === 'adsmasters2026') {
        sessionStorage.setItem('rg_auth', '1');
        var dest = sessionStorage.getItem('rg_dest') || 'index.html';
        sessionStorage.removeItem('rg_dest');
        window.location.replace(dest);
      } else {
        document.getElementById('err').style.display = 'block';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
  </script>
</body>
</html>
